<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galaxy — Demo</title>

    <style>
      html,
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        height: 100%;
      }
      body {
        align-items: center;
        background-color: #121212;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin: 0;
        padding: 0;
      }

      .player {
        width: 100%;
        max-width: 192rem;
        border: solid #212121 4px;
      }

      a {
        color: #ccc;
        display: block;
        text-decoration: none;
        text-align: left;
        width: 192rem;
        margin-bottom: 1rem;
        font-size: 1.6rem;
        font-weight: bold;
      }
      a:hover {
        color: #fff;
      }

      .caption {
        margin-top: 1rem;
        font-size: 1.2rem;
        color: gray;
      }
    </style>
  </head>
  <body>
    <a href="https://github.com/zero0Halo/galaxy">&laquo; Back</a>
    <video controls class="player">
      <source src="galaxy.mp4" type="video/mp4" />
      Your browser does not support HTML5 video.
    </video>
    <div class="caption">
      <strong>Galaxy</strong>, Engineered by Steve Swanson
    </div>
  </body>
</html>
